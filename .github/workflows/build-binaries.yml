name: Build Binaries

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version string baked into the binary (default: dev)"
        required: false
        default: "dev"
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore:
      - "docs/**"
      - "**.md"

permissions:
  contents: write

env:
  VERSION: ${{ github.event.inputs.version || github.ref_name }}
  BASE_TAGS: "with_quic,with_dhcp,with_wireguard,with_utls,with_acme,with_clash_api,with_tailscale,with_gvisor"

jobs:
  build:
    name: ${{ matrix.goos }}-${{ matrix.output }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: windows, goarch: amd64, goamd64: v1, output: windows-amd64, tags: "with_quic,with_dhcp,with_wireguard,with_utls,with_acme,with_clash_api,with_tailscale,with_gvisor" }
          - { goos: linux,   goarch: amd64, goamd64: v1, output: linux-amd64,   tags: "with_quic,with_dhcp,with_wireguard,with_utls,with_acme,with_clash_api,with_tailscale,with_gvisor,with_ebpf" }
          - { goos: linux,   goarch: arm64,             output: linux-arm64,     tags: "with_quic,with_dhcp,with_wireguard,with_utls,with_acme,with_clash_api,with_tailscale,with_gvisor,with_ebpf" }
          - { goos: android, goarch: arm64,             output: android-arm64,   tags: "with_quic,with_dhcp,with_wireguard,with_utls,with_acme,with_clash_api,with_tailscale,with_gvisor,with_ebpf" }
          - { goos: darwin,  goarch: amd64,             output: darwin-amd64,    tags: "with_quic,with_dhcp,with_wireguard,with_utls,with_acme,with_clash_api,with_tailscale,with_gvisor" }
          - { goos: darwin,  goarch: arm64,             output: darwin-arm64,    tags: "with_quic,with_dhcp,with_wireguard,with_utls,with_acme,with_clash_api,with_tailscale,with_gvisor" }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache: true

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOAMD64: ${{ matrix.goamd64 }}
        shell: bash
        run: |
          EXT=""
          if [ "${{ matrix.goos }}" = "windows" ]; then EXT=".exe"; fi
          CGO_ENABLED=0 go build -tags "${{ matrix.tags }}" -trimpath \
            -ldflags "-X github.com/sagernet/sing-box/constant.Version=${VERSION} -s -w" \
            -o "sing-box-${VERSION}-${{ matrix.output }}${EXT}" ./cmd/sing-box

      - name: Package
        shell: bash
        run: |
          mkdir -p dist
          if [ "${{ matrix.goos }}" = "windows" ]; then
            zip -j "dist/sing-box-${VERSION}-${{ matrix.output }}.zip" "sing-box-${VERSION}-${{ matrix.output }}.exe"
          else
            tar -czf "dist/sing-box-${VERSION}-${{ matrix.output }}.tar.gz" "sing-box-${VERSION}-${{ matrix.output }}"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: sing-box-${{ matrix.output }}
          path: dist/*
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
